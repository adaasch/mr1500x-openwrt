# Pinned package feeds for the MR1500X release build.
#-
# CARE: no line here may be a BARE "#". scripts/feeds strips comments with
# s/#.+$// — one character is REQUIRED after the hash — so a lone "#" survives
# as content and the parser dies with "Syntax error in feeds.conf, line 1".
# Every blank-looking separator below is therefore "#-", not "#".
#-
# WHY THIS FILE EXISTS AT ALL
# The bench tree's LuCI feed was NOT fetched by `scripts/feeds update`: it was a
# hand-made shallow clone of the GitHub mirror's `openwrt-21.02` BRANCH.
# A branch is a moving target, so a
# clean rebuild months later would get different LuCI sources than the image we
# validated — breaking both reproducibility and the "differential vs v18" gate.
# The release pins exact revisions instead, and build_image.sh copies this file
# over feeds.conf before `scripts/feeds update -a`.
#-
# Only two feeds are listed: routing and telephony contribute nothing to this
# image and each one is a multi-minute clone.
#-
# packages: the revision OpenWrt 21.02.7 itself pins, unchanged from
# feeds.conf.default (the bench tree is on exactly this commit).
src-git-full packages https://git.openwrt.org/feed/packages.git^48242ee7a190db7740f7b9b3ef1debfa4d5857f6

# luci: the revision the validated image was actually built from (2023-07-27,
# branch openwrt-21.02 of the GitHub mirror), NOT the 21.02.7 pin
# e98243ef9eb838cca80cdd6d1bd0cf69a509d103. The mirror is used because
# git.openwrt.org was unusably slow from the build host; a commit hash is
# content-addressed, so which host served it does not matter.
#-
# Moving to the 21.02.7 pin is a legitimate change — it is *more* official — but
# it is a different LuCI than the one every wireless-UI behaviour in WIFI.md was
# verified against, so it wants a bench re-test, not a one-line edit here.
src-git-full luci https://github.com/openwrt/luci.git^e4c46338b196e486a88b1a75b78e283708c82bc4

# After `scripts/feeds update -a`, install only what the seed config needs:
#   scripts/feeds install -a -p luci
#   scripts/feeds install cgi-io liblucihttp liblucihttp-lua
# then apply publish/config/mr1500x.diffconfig and `make defconfig`.
# ASSERT afterwards that the luci symbols survived defconfig — see the header of
# mr1500x.diffconfig for why they silently would not.
