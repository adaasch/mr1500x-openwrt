# opkg feeds for the MR1500X (OpenWrt 21.02.7 userspace on the VENDOR 4.4.176 kernel).
#
# *** openwrt_core (targets/ramips/mt7621/...) is DELIBERATELY REMOVED. ***
# That feed ships kernel packages (kmods) built for the stock mt7621 5.4
# kernel. On this box the kernel is the vendor 4.4.176 — those kmods would
# install into /lib/modules/5.4.61/ and never load (vermagic mismatch), wasting
# overlay space and creating broken deps. Re-add ONLY if you know why.
#
# openwrt_base + openwrt_packages ship pure userland for musl mipsel_24kc,
# which matches this rootfs (verified: iptables installs and runs).

src/gz openwrt_base https://downloads.openwrt.org/releases/21.02.7/packages/mipsel_24kc/base
src/gz openwrt_packages https://downloads.openwrt.org/releases/21.02.7/packages/mipsel_24kc/packages
